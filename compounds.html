<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodic Table — Compound Synthesis Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="translations.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #05070c;
      --surface: #0d1117;
      --surface2: #161b26;
      --cyan: #00d4ff;
      --green: #4ade80;
      --purple: #a855f7;
      --amber: #f59e0b;
      --pink: #ec4899;
      --text: #e2e8f0;
      --muted: #8492a6;
      --border: rgba(74, 222, 128, 0.25);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    html[lang="ar"] body,
    html[lang="ar"] button,
    html[lang="ar"] .compound-name,
    html[lang="ar"] .compound-desc,
    html[lang="ar"] .beaker-status,
    html[lang="ar"] .synthesis-verdict,
    html[lang="ar"] .nav-link {
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Top Nav */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .nav-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .nav-link {
      text-decoration: none;
      color: rgba(74, 222, 128, 0.8);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .nav-link:hover {
      color: #fff;
      background: rgba(74, 222, 128, 0.15);
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.35);
    }
    .lang-toggle { display: flex; gap: 6px; }
    .lang-opt {
      background: transparent;
      border: 1px solid transparent;
      color: rgba(0, 212, 255, 0.6);
      font-family: monospace;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-opt:hover { color: var(--cyan); }
    .lang-opt.active {
      background: rgba(0, 212, 255, 0.18);
      color: #fff;
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.35);
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 6px 10px;
    }
    .page-title {
      font-size: clamp(22px, 3.8vw, 36px);
      color: var(--green);
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
    }
    .page-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    /* View Switcher */
    .view-container { width: 100%; }

    /* Catalog View */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
      margin-top: 10px;
    }
    .compound-card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.25s ease;
      position: relative;
    }
    .compound-card:hover {
      transform: translateY(-4px);
      border-color: var(--green);
      box-shadow: 0 8px 24px rgba(74, 222, 128, 0.15);
    }
    .card-formula {
      font-size: 26px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 1px;
    }
    .compound-name {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .compound-desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .formula-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .formula-badge {
      background: rgba(0, 212, 255, 0.12);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: var(--cyan);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
    }
    .btn-synthesize {
      margin-top: auto;
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid var(--green);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 1px;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-synthesize:hover {
      background: var(--green);
      color: #05070c;
      box-shadow: 0 0 16px rgba(74, 222, 128, 0.5);
    }

    /* Synthesizer Workspace View */
    .synth-view {
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    .synth-view.active { display: flex; }

    .synth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 12px;
    }
    .target-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .target-formula {
      font-size: 32px;
      font-weight: 700;
      color: var(--cyan);
    }
    .btn-back-catalog {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      transition: all 0.2s;
    }
    .btn-back-catalog:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.05);
    }

    /* Beaker Chamber Area */
    .synth-arena {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }
    @media (max-width: 860px) {
      .synth-arena { grid-template-columns: 1fr; }
    }

    .beaker-interactive {
      background: var(--surface);
      border: 2px solid rgba(74, 222, 128, 0.4);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 380px;
      position: relative;
      box-shadow: inset 0 0 30px rgba(74, 222, 128, 0.05);
    }

    /* Elements floating inside the beaker */
    .beaker-contents {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 20px;
    }

    .atom-pill {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00d4ff, #0284c7);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.5);
      animation: floatAtom 2s ease-in-out infinite alternate;
      cursor: pointer;
    }
    .atom-pill:hover { transform: scale(1.1); }
    @keyframes floatAtom {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .beaker-bottom-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }
    .btn-clear-beaker {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      transition: all 0.2s;
    }
    .btn-clear-beaker:hover {
      background: #ef4444;
      color: #fff;
    }
    .btn-trigger-reaction {
      background: var(--green);
      border: 1px solid var(--green);
      color: #05070c;
      font-weight: 700;
      padding: 9px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 1px;
      box-shadow: 0 0 14px rgba(74, 222, 128, 0.4);
      transition: all 0.2s;
    }
    .btn-trigger-reaction:hover {
      box-shadow: 0 0 24px rgba(74, 222, 128, 0.8);
      transform: scale(1.02);
    }

    /* Shelf of Dispenser Elements */
    .dispenser-panel {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dispenser-title {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .dispenser-atoms {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .atom-btn {
      background: var(--surface2);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: var(--cyan);
      border-radius: 10px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .atom-btn:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
      transform: scale(1.05);
    }
    .atom-btn-sym { font-size: 18px; font-weight: 700; }
    .atom-btn-num { font-size: 10px; color: var(--muted); }

    /* Success / Reaction Modal Overlay */
    .reaction-overlay {
      position: fixed; inset: 0;
      background: rgba(5, 7, 12, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }
    .reaction-overlay.active { display: flex; }
    .reaction-card {
      background: var(--surface);
      border: 2px solid var(--green);
      border-radius: 16px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.4);
      animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .reaction-title {
      font-size: 26px;
      color: var(--green);
      font-weight: 700;
    }
    .reaction-formula {
      font-size: 44px;
      font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
    }
    .reaction-fact {
      color: var(--text);
      font-size: 13px;
      line-height: 1.6;
    }
    .btn-close-modal {
      background: var(--green);
      border: none;
      color: #05070c;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 10px;
    }

    /* RTL */
    html[lang="ar"] .shell { direction: rtl; }
    html[lang="ar"] .page-title { letter-spacing: 0; }
    html[lang="ar"] .btn-synthesize { letter-spacing: 0; }
    html[lang="ar"] .btn-trigger-reaction { letter-spacing: 0; }
  </style>
</head>
<body>

<div class="shell">
  <!-- Top Nav -->
  <header class="header-bar">
    <div class="nav-links">
      <a href="index.html" class="nav-link" id="nav-table">← PERIODIC TABLE</a>
      <a href="chamber.html" class="nav-link" id="nav-chamber">MATTER CHAMBER</a>
      <a href="facts.html" class="nav-link" id="nav-facts">FACTS</a>
    </div>
    <div class="lang-toggle">
      <button class="lang-opt active" data-lang="en">EN</button>
      <button class="lang-opt" data-lang="ar">عربي</button>

  </header>

  <!-- Hero Header -->
  <section class="hero">
    <h1 class="page-title" id="page-title">COMPOUND SYNTHESIS LAB</h1>
    <p class="page-subtitle" id="page-subtitle">Select chemical compounds and interactively combine atoms to synthesize molecular bonds</p>
  </section>

  <!-- View 1: Catalog of Popular Compounds -->
  <div id="view-catalog" class="view-container">
    <div class="catalog-grid" id="catalog-grid"></div>

  <!-- View 2: Interactive Synthesis Beaker Workspace -->
  <div id="view-synth" class="synth-view">
    <div class="synth-header">

          <div style="color: #fff; font-weight: 700; font-size: 16px;" id="synth-target-name">Water</div>

          <button class="btn-trigger-reaction" id="btn-react">SYNTHESIZE REACTION ⚡</button>
        </div>
      </div>

      <!-- Element Dispenser Shelf -->
      <div class="dispenser-panel">
        <div class="dispenser-title" id="lbl-dispenser">CLICK TO ADD ATOMS:</div>
        <div class="dispenser-atoms" id="dispenser-atoms">
          <!-- Dispenser element buttons -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Reaction Success Overlay Modal -->
<div class="reaction-overlay" id="reaction-overlay">
  <div class="reaction-card">
    <div style="font-size: 40px;">⚗️ ✨</div>
    <div class="reaction-title" id="modal-title">SYNTHESIS SUCCESSFUL!</div>
    <div class="reaction-formula" id="modal-formula">H₂O</div>
    <div style="font-weight: 600; color: #fff;" id="modal-name">Water</div>
    <div class="reaction-fact" id="modal-fact"></div>
    <button class="btn-close-modal" id="btn-close-modal">CONTINUE EXPERIMENTING</button>
  </div>
</div>

  let currentLang = localStorage.getItem('ptLang') || 'en';
  let activeCompound = null;
  const beakerAtoms = []; // List of symbols inside beaker

  function renderCatalog() {
    const grid = document.getElementById('catalog-grid');
    grid.innerHTML = '';
    const t = I18N[currentLang];

    COMPOUNDS.forEach(c => {
      const card = document.createElement('div');
      card.className = 'compound-card';
      const name = currentLang === 'ar' ? c.nameAr : c.nameEn;
      const desc = currentLang === 'ar' ? c.descAr : c.descEn;

      const reqBadges = Object.entries(c.recipe)
        .map(([sym, count]) => `<span class="formula-badge">${count} × ${sym}</span>`)
        .join(' ');

      card.innerHTML = `
        <div class="card-formula">${c.formula}</div>
        <div class="compound-name">${name}</div>
        <div class="compound-desc">${desc}</div>
        <div class="formula-badges">${reqBadges}</div>
        <button class="btn-synthesize" data-id="${c.id}">${t.btnSynthesize}</button>
      `;

      card.querySelector('.btn-synthesize').addEventListener('click', () => {
        openSynthesizer(c);
      });

      grid.appendChild(card);
    });
  }

  function renderDispenser() {
    const shelf = document.getElementById('dispenser-atoms');
    shelf.innerHTML = '';

    DISPENSER_ELEMENTS.forEach(el => {
      const btn = document.createElement('button');
      btn.className = 'atom-btn';
      btn.innerHTML = `
        <span class="atom-btn-sym">${el.sym}</span>
        <span class="atom-btn-num">${el.num}</span>
      `;
      btn.addEventListener('click', () => {
        addAtomToBeaker(el.sym);
      });
      shelf.appendChild(btn);
    });
  }

  function openSynthesizer(compound) {
    activeCompound = compound;
    beakerAtoms.length = 0;
    renderBeaker();

    document.getElementById('view-catalog').style.display = 'none';
    const synthView = document.getElementById('view-synth');
    synthView.classList.add('active');

    document.getElementById('synth-target-formula').textContent = compound.formula;
    document.getElementById('synth-target-name').textContent = currentLang === 'ar' ? compound.nameAr : compound.nameEn;

    const reqText = Object.entries(compound.recipe).map(([s, n]) => `${n} ${s}`).join(' + ');
    document.getElementById('synth-target-req').textContent = (currentLang === 'ar' ? 'المطلوب: ' : 'Requires: ') + reqText;
  }

  function closeSynthesizer() {
    activeCompound = null;
    document.getElementById('view-synth').classList.remove('active');
    document.getElementById('view-catalog').style.display = 'block';
  }

  function addAtomToBeaker(sym) {
    if (!activeCompound) return;
    if (beakerAtoms.length >= 10) return; // safety limit
    beakerAtoms.push(sym);
    renderBeaker();
  }

  function renderBeaker() {
    const container = document.getElementById('beaker-atoms');
    container.innerHTML = '';

    beakerAtoms.forEach((sym, idx) => {
      const pill = document.createElement('div');
      pill.className = 'atom-pill';
      pill.textContent = sym;
      pill.title = currentLang === 'ar' ? 'انقر للحذف' : 'Click to remove';
      pill.addEventListener('click', () => {
        beakerAtoms.splice(idx, 1);
        renderBeaker();
      });
      container.appendChild(pill);
    });
  }

  function checkReaction() {
    if (!activeCompound) return;
    const counts = {};
    beakerAtoms.forEach(sym => { counts[sym] = (counts[sym] || 0) + 1; });

    let match = true;
    for (const [sym, count] of Object.entries(activeCompound.recipe)) {
      if (counts[sym] !== count) { match = false; break; }
    }
    for (const sym of Object.keys(counts)) {
      if (!activeCompound.recipe[sym]) { match = false; break; }
    }

    const overlay = document.getElementById('reaction-overlay');
    const t = I18N[currentLang];

    if (match) {
      document.getElementById('modal-title').textContent = t.successTitle;
      document.getElementById('modal-title').style.color = 'var(--green)';
      document.getElementById('modal-formula').textContent = activeCompound.formula;
      document.getElementById('modal-name').textContent = currentLang === 'ar' ? activeCompound.nameAr : activeCompound.nameEn;
      document.getElementById('modal-fact').textContent = currentLang === 'ar' ? activeCompound.factAr : activeCompound.factEn;
      overlay.classList.add('active');
    } else {
      document.getElementById('modal-title').textContent = t.failTitle;
      document.getElementById('modal-title').style.color = '#ef4444';
      document.getElementById('modal-formula').textContent = '⚠️';
      document.getElementById('modal-name').textContent = '';
      document.getElementById('modal-fact').textContent = t.failDesc;
      overlay.classList.add('active');
    }
  }

  function applyLanguage() {
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

    const t = I18N[currentLang];
    document.getElementById('nav-table').textContent = t.navTable;
    document.getElementById('nav-chamber').textContent = t.navChamber;
    document.getElementById('nav-facts').textContent = t.navFacts;
    document.getElementById('page-title').textContent = t.pageTitle;
    document.getElementById('page-subtitle').textContent = t.pageSubtitle;
    document.getElementById('btn-back-catalog').textContent = t.backCatalog;
    document.getElementById('lbl-beaker-status').textContent = t.beakerReady;
    document.getElementById('btn-clear').textContent = t.beakerEmpty;
    document.getElementById('btn-react').textContent = t.beakerReact;
    document.getElementById('lbl-dispenser').textContent = t.dispenserTitle;
    document.getElementById('btn-close-modal').textContent = t.modalContinue;

    document.querySelectorAll('.lang-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === currentLang);
    });

    renderCatalog();
    renderDispenser();
  }

  // Events
  document.getElementById('btn-back-catalog').addEventListener('click', closeSynthesizer);
  document.getElementById('btn-clear').addEventListener('click', () => {
    beakerAtoms.length = 0;
    renderBeaker();
  });
  document.getElementById('btn-react').addEventListener('click', checkReaction);
  document.getElementById('btn-close-modal').addEventListener('click', () => {
    document.getElementById('reaction-overlay').classList.remove('active');
  });

  document.querySelectorAll('.lang-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem('ptLang', currentLang);
      applyLanguage();
    });
  });

  // Init
  applyLanguage();
})();
</script>
</body>
</html>
