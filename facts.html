<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodic Table — Facts & Insights</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="translations.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #05070c;
      --surface: #0d1117;
      --surface2: #161b26;
      --cyan: #00d4ff;
      --purple: #a855f7;
      --pink: #ec4899;
      --amber: #f59e0b;
      --green: #4ade80;
      --text: #e2e8f0;
      --muted: #8492a6;
      --border: rgba(0, 212, 255, 0.15);
      --card-radius: 14px;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Arabic typography enhancement */
    html[lang="ar"] body,
    html[lang="ar"] button,
    html[lang="ar"] input,
    html[lang="ar"] .fact-title,
    html[lang="ar"] .fact-summary,
    html[lang="ar"] .fact-explanation,
    html[lang="ar"] .page-subtitle,
    html[lang="ar"] .filter-btn,
    html[lang="ar"] .tag,
    html[lang="ar"] .nav-link {
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
    }

    /* Ambient scanline cyber overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Header & Navigation */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .nav-link {
      text-decoration: none;
      color: rgba(0, 212, 255, 0.7);
      border: 1px solid rgba(0, 212, 255, 0.25);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-link:hover {
      color: #fff;
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.35);
    }

    .lang-toggle {
      display: flex;
      gap: 6px;
    }
    .lang-opt {
      background: transparent;
      border: 1px solid transparent;
      color: rgba(0, 212, 255, 0.6);
      font-family: monospace;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-opt:hover { color: var(--cyan); }
    .lang-opt.active {
      background: rgba(0, 212, 255, 0.18);
      color: #fff;
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.35);
    }

    /* Hero section */
    .hero {
      text-align: center;
      padding: 20px 10px 10px;
    }
    .page-title {
      font-size: clamp(24px, 4vw, 38px);
      color: var(--cyan);
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.4), 0 0 40px rgba(168, 85, 247, 0.3);
      margin-bottom: 10px;
    }
    .page-subtitle {
      color: var(--muted);
      max-width: 680px;
      margin: 0 auto;
      font-size: 13px;
    }

    /* Category filter tabs */
    .filters-wrap {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      color: #fff;
      border-color: rgba(0, 212, 255, 0.4);
    }
    .filter-btn.active {
      color: #fff;
      background: rgba(168, 85, 247, 0.2);
      border-color: var(--purple);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }

    /* Facts Grid */
    .facts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .fact-card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--card-radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .fact-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      opacity: 0.6;
      transition: opacity 0.3s;
    }
    .fact-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 212, 255, 0.35);
      box-shadow: 0 10px 24px -5px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 212, 255, 0.15);
    }
    .fact-card:hover::before {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .fact-icon {
      font-size: 26px;
      line-height: 1;
    }
    .tag {
      font-size: 10px;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      text-transform: uppercase;
    }
    .tag.history { color: #f59e0b; border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.08); }
    .tag.anomalies { color: #ec4899; border-color: rgba(236, 72, 153, 0.3); background: rgba(236, 72, 153, 0.08); }
    .tag.cosmic { color: #00d4ff; border-color: rgba(0, 212, 255, 0.3); background: rgba(0, 212, 255, 0.08); }
    .tag.trends { color: #4ade80; border-color: rgba(74, 222, 128, 0.3); background: rgba(74, 222, 128, 0.08); }

    .fact-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.4;
    }

    .fact-summary {
      color: rgba(0, 212, 255, 0.9);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .fact-explanation {
      color: var(--text);
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .fact-meta {
      margin-top: auto;
      padding-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .badge-sym {
      background: rgba(0, 212, 255, 0.12);
      color: var(--cyan);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* Arabic RTL adjustment */
    html[lang="ar"] .shell { direction: rtl; }
    html[lang="ar"] .fact-summary { letter-spacing: 0; }
    html[lang="ar"] .page-title { letter-spacing: 0; }
    html[lang="ar"] .nav-link { letter-spacing: 0; }
    html[lang="ar"] .filter-btn { letter-spacing: 0; }
  </style>
</head>

        tag: "Trends & Forces",
        summary: "Tungsten boasts the highest melting point of all elemental metals at 3,422°C.",
        explanation: "Tungsten (W) has the highest melting point of any pure metal (3,422°C), which is why it illuminated the world for a century as the glowing filament in incandescent bulbs. Carbon (C) in the form of diamond and graphite withstands even greater temperatures, sublimating directly from solid to vapor at approximately 3,550°C without ever turning liquid at atmospheric pressure."
      },
      ar: {
        title: "التنغستن والكربون: عمالقة التحمل الحراري",
        tag: "الاتجاهات والقوى",
        summary: "يمتلك التنغستن أعلى نقطة انصهار بين جميع الفلزات وتصل إلى 3422 درجة مئوية.",
        explanation: "يمتلك التنغستن (W) أعلى نقطة انصهار بين كافة الفلزات النقية (3,422°C)، ولهذا السبب أنار العالم لأكثر من قرن كفتيل متوهج في المصابيح التقليدية. أما الكربون (C) بهيئتيه الماس والجرافيت، فيتحمل درجات أعلى حيث يتسامى مباشرة من الصلابة إلى الغاز عند 3,550°C دون أن يمر بالحالة السائلة عند الضغط الجوي العادي."
      }
    }
  ];

  const T = window.TRANSLATIONS || {};
  let currentLang = localStorage.getItem('ptLang') || 'en';
  let activeCategory = 'all';

  function ui(key) {
    return (T.ui && T.ui[currentLang] && T.ui[currentLang][key]) || (T.ui && T.ui.en && T.ui.en[key]) || key;
  }

  function applyLanguage() {
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

    document.querySelectorAll('.lang-opt').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });

    document.getElementById('back-nav').textContent = ui('factsBack');
    const navChamber = document.getElementById('nav-chamber');
    if (navChamber) navChamber.textContent = ui('statesBtn');
    const navCompounds = document.getElementById('nav-compounds');
    if (navCompounds) navCompounds.textContent = ui('compoundsBtn');
    document.getElementById('page-title').textContent = ui('factsTitle');
    document.getElementById('page-subtitle').textContent = ui('factsSubtitle');

    document.getElementById('filter-all').textContent = ui('factsFilterAll');
    document.getElementById('filter-history').textContent = ui('factsFilterHistory');
    document.getElementById('filter-anomalies').textContent = ui('factsFilterAnomalies');
    document.getElementById('filter-cosmic').textContent = ui('factsFilterCosmic');
    document.getElementById('filter-trends').textContent = ui('factsFilterTrends');

    renderCards();
  }

  function renderCards() {
    const grid = document.getElementById('facts-grid');
    grid.innerHTML = '';

    const filtered = activeCategory === 'all'
      ? FACTS_DATA
      : FACTS_DATA.filter(f => f.cat === activeCategory);

    filtered.forEach(item => {
      const data = item[currentLang];
      const card = document.createElement('article');
      card.className = 'fact-card';

      const badgesHtml = item.elements.map(sym => `<span class="badge-sym">${sym}</span>`).join(' ');

      card.innerHTML = `
        <div class="card-top">
          <span class="fact-icon">${item.icon}</span>
          <span class="tag ${item.cat}">${data.tag}</span>
        </div>
        <h2 class="fact-title">${data.title}</h2>
        <div class="fact-summary">${data.summary}</div>
        <p class="fact-explanation">${data.explanation}</p>
        <div class="fact-meta">
          <span>${currentLang === 'ar' ? 'عناصر مرتبطة:' : 'Key elements:'}</span>
          ${badgesHtml}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Filter clicks
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.category;
      renderCards();
    });
  });

  // Language clicks
  document.querySelectorAll('.lang-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem('ptLang', currentLang);
      applyLanguage();
    });
  });

  // Initial render
  applyLanguage();
})();
</script>
</body>
</html>
